<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate | Smart Tech</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], },
                    colors: {
                        brandBlue: '#0f4c81', 
                        brandGold: '#f59e0b', 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="/logo.png" alt="Smart Tech Logo" class="h-10 w-10 rounded-full object-cover border-2 border-brandGold shadow-sm" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'48\' fill=\'%230f4c81\' stroke=\'%23f59e0b\' stroke-width=\'4\'/%3E%3Ctext x=\'50\' y=\'62\' font-family=\'Arial, sans-serif\' font-size=\'32\' font-weight=\'bold\' fill=\'%23ffffff\' text-anchor=\'middle\'%3EST%3C/text%3E%3C/svg%3E';">
                <span class="font-bold text-xl text-brandBlue tracking-tight">SMART <span class="text-brandGold">TECH</span></span>
            </a>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-brandBlue transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </header>

    <div class="flex-1 flex items-center justify-center p-4 py-10">
        <div class="w-full max-w-xl mx-auto bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden transform transition-all hover:-translate-y-1 hover:shadow-2xl duration-300">
            
            <div class="relative h-48 sm:h-56 bg-slate-900">
                <img src="https://iili.io/CyPb521.md.jpg" alt="Certificate Banner" class="w-full h-full object-cover opacity-80" onerror="this.src='https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1200'">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                
                <div class="absolute bottom-5 left-6 bg-white/20 backdrop-blur-md border border-white/30 text-white text-xs font-bold px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-shield-check text-[#f59e0b]"></i> Smart Tech Official
                </div>
            </div>

            <div class="p-8 sm:p-10 text-center sm:text-left">
                <h2 class="text-3xl font-extrabold text-[#0f4c81] mb-3 tracking-tight flex justify-center sm:justify-start items-center gap-2">
                    Hello Students 👋
                </h2>
                <p class="text-gray-600 text-base sm:text-lg mb-8 leading-relaxed font-medium">
                    Have you completed your course? <br class="hidden sm:block"> 
                    <span class="text-gray-800 font-bold">Can you verify your certificate?</span> Check your original Smart Tech documents instantly.
                </p>

                <a href="https://www.ncaskill.com/verification?certificate" target="_blank" class="inline-flex items-center justify-center w-full sm:w-auto bg-gradient-to-r from-[#0f4c81] to-blue-800 text-white font-bold text-base px-8 py-4 rounded-full shadow-[0_8px_20px_-6px_rgba(15,76,129,0.5)] hover:shadow-[0_12px_25px_-6px_rgba(15,76,129,0.7)] hover:-translate-y-0.5 transition-all duration-300 gap-3 group">
                    <span>Click here to verify</span>
                    <i class="fa-solid fa-arrow-right-long transform group-hover:translate-x-1 transition-transform"></i>
                </a>
                
                <div class="mt-6 flex items-center justify-center sm:justify-start gap-2 text-xs text-gray-400 font-semibold uppercase tracking-wider">
                    <i class="fa-solid fa-lock text-green-500"></i> 100% Secure Verification Portal
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING AI PRO BUTTON -->
    <div class="fixed bottom-6 right-4 z-40 group">
        <button onclick="toggleAiAssistant()" class="relative w-12 h-12 md:w-14 md:h-14 bg-gradient-to-tr from-indigo-600 via-blue-600 to-cyan-500 text-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 border-2 border-white/80 focus:outline-none" aria-label="Open Smart Tech AI Pro">
            <span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-cyan-500 border border-white"></span>
            </span>
            <i class="fa-solid fa-robot text-xl md:text-2xl"></i>
        </button>
    </div>

    <!-- AI MODAL -->
    <div id="ai-assistant-modal" class="fixed inset-0 sm:inset-auto sm:bottom-6 sm:right-6 z-50 hidden flex flex-col w-full h-full sm:w-[440px] sm:h-[640px] sm:max-h-[90vh] bg-white sm:rounded-3xl shadow-2xl border border-gray-200 overflow-hidden transform transition-all duration-300">
        <div class="bg-gradient-to-r from-brandBlue via-indigo-900 to-slate-900 text-white p-3.5 px-4 flex items-center justify-between shadow-sm select-none">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-cyan-400 to-indigo-500 flex items-center justify-center text-white shadow">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm leading-tight">Smart Tech AI Pro</h3>
                    <p class="text-[10px] text-blue-200">24/7 Certificate & Learning Helper</p>
                </div>
            </div>
            <button onclick="toggleAiAssistant()" class="text-white/80 hover:text-white p-1.5 rounded-lg text-base">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="flex-1 bg-slate-950 relative overflow-hidden flex flex-col">
            <iframe id="ai-iframe" data-src="https://pradeep-ai-png.github.io/smart-tech-aipro/" class="w-full h-full border-0 flex-1 bg-white"></iframe>
        </div>
    </div>

    <script>
        window.toggleAiAssistant = function() {
            const modal = document.getElementById('ai-assistant-modal');
            const iframe = document.getElementById('ai-iframe');
            if (!modal) return;
            if (modal.classList.contains('hidden')) {
                if (iframe && !iframe.src && iframe.dataset.src) {
                    iframe.src = iframe.dataset.src;
                }
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
