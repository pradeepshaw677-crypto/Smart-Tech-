
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Centre - Computer Classes</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f8fafc; 
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Computer Image Slider Banner */
        .slider-container {
            width: 100%;
            overflow: hidden;
            background: #ffffff;
            padding: 20px 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            white-space: nowrap;
        }
        .slider-track {
            display: inline-block;
            animation: slideImages 15s linear infinite; 
        }
        
        .slider-container:hover .slider-track {
            animation-play-state: paused; /* Hover karne par slider ruk jayega */
        }

        .slider-track img {
            height: 200px;
            width: 350px;
            margin: 0 15px;
            border-radius: 12px;
            display: inline-block;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        @keyframes slideImages {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        /* Button Container */
        .action-container {
            margin-top: 60px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #e2e8f0;
        }

        .action-container h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* Action Button */
        button { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; 
            border: none; 
            padding: 18px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <!-- Running Computer Images Banner -->
    <div class="slider-container">
        <div class="slider-track">
            <!-- 3 Computer/Tech Images -->
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Laptop Coding">
            <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Computer Setup">
            <img src="https://images.unsplash.com/photo-1531297172864-fd22b14ce3fd?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Programming Tech">
            
            <!-- Repeat same 3 images for seamless loop -->
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Laptop Coding">
            <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Computer Setup">
            <img src="https://images.unsplash.com/photo-1531297172864-fd22b14ce3fd?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Programming Tech">
        </div>
    </div>

    <!-- Student Login Button Area -->
    <div class="action-container">
        <h2>Student Portal</h2>
        <button onclick="openPortal()">Click here to login and attendance and view syllabus</button>
    </div>

    <script>
        function openPortal() {
            // Button click hone par seedha aapka link open ho jayega
            window.open("https://uptight-moccasin-fddl0xue.edgeone.dev/", "_blank");
        }
    </script>

</body>
</html>
